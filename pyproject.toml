[project]
name = "rouge"
version = "0.3.0"
description = "Autonomous AI Red Team & Remediation Hive"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "litellm>=1.0",
    "langgraph>=0.2",
    "click>=8.0",
    "rich>=13.0",
    "aiohttp>=3.8",
]

[project.scripts]
rouge = "rouge.cli:main"

[tool.setuptools.packages.find]
include = ["rouge*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
